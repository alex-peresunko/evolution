[project]
name = "evolution"
version = "0.1.0"
description = "Neural network-driven evolution simulator"
authors = [
    {name = "Oleksandr Peresunko"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "numpy (>=2.4.5,<3.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "evolution", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q -m 'not golden'"
markers = ["golden: bit-exact trace check, opt-in (make golden)"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.17,<0.16.0)"
]
