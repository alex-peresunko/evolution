services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    # Starts from and saves into the host's best_brain_*.json; don't run game.py on the same
    # folder at the same time, both write those files.
    volumes:
      - ./saved_brains:/app/saved_brains

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 9090:9090
    depends_on:
      - server

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    environment:
      # Local-only: no login, and the evolution dashboard is the home page.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/evolution.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/evolution.json:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus

# Kept across make stop; make clean-data removes them.
volumes:
  prometheus-data:
  grafana-data:
